name: Rebuild database and web key

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "photos/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python tools/build.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data docs species photos
          git diff --cached --quiet || git commit -m "Rebuild generated files"
          git push
