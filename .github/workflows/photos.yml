name: Fetch open-licence end-grain photos

on:
  workflow_dispatch:
  push:
    branches: [rebuild]
    paths:
      - "tools/fetch_photos.py"
      - ".github/workflows/photos.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Fetch photos
        run: python tools/fetch_photos.py
      - name: Commit photos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/photos tools/goimai_listing.json _candidates || true
          git diff --cached --quiet || git commit -m "Add open-licence end-grain photos"
          git pull --rebase
          git push
